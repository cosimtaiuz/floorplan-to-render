name: Bug report
description: Something does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include your API key, a `.env.local`
        file, or any server log line that contains one.

        For a security problem, do not open an issue — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a plan with ...
        2. Place the camera at ...
        3. Hit Generate 3D scene
        4. ...
    validations:
      required: true

  - type: dropdown
    id: step
    attributes:
      label: Which step
      options:
        - Floorplan upload
        - Camera placement
        - 3D scene generation
        - Walking around the scene
        - Render
        - Something else / not step-specific
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, Node version (`node -v`), and how you are running it (`pnpm dev` or a deployment).
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console or server output
      description: Any relevant error. This is rendered as code, so no backticks needed.
      render: shell
    validations:
      required: false
